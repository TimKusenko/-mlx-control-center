[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-control-center"
version = "2.0.0"
description = "Remote control and monitoring for MLX models running on Mac mini"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Tim Kusenko", email = "timkusenko.tk@gmail.com"},
]
keywords = ["mlx", "mac", "inference", "llm", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/timkusenko/mlx-control-center"
Documentation = "https://github.com/timkusenko/mlx-control-center#readme"
Repository = "https://github.com/timkusenko/mlx-control-center"
Issues = "https://github.com/timkusenko/mlx-control-center/issues"

[project.scripts]
mlx = "mlx_control.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["mlx_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
